services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 1s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb -p local/pinsphere;
      mc anonymous set download local/pinsphere;
      mc anonymous get local/pinsphere;
      "

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pin_sphere
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pin_sphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  app:
    build: .
    command: sh /app/startup/entrypoint.sh

    container_name: pinsphere-app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DATABASE_DSN: "postgresql://postgres:postgres@postgres:5432/pin_sphere"
      REDIS_DSN: "redis://redis:6379/0"
      CELERY_QUEUE_URL: "redis://redis:6379/1"
      ALGORITHM: "HS256"
      AUTH_SECRET: "159cdf30c1cee803eec9dc63bb16c1b2882c4354aa2eb6a34a46ed50775d94ad"
      AWS_STORAGE_BUCKET_NAME: "pinsphere"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin123"
      AWS_SIGNATURE_VERSION: "s3v4"
      AWS_ENDPOINT_URL: "http://10.146.36.146:9000"
      ENVIRONMENT: "dev"
      SBERT_MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
  celery-worker:
    build: .
    command: make run-celery
    container_name: pinsphere-celery
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started

    environment:
      CELERY_QUEUE_URL: "redis://redis:6379/1"

volumes:
  minio_data:
  postgres_data:
  redis_data:
